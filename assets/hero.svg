    <rect x="1096" y="74" width="7" height="10" fill="#8B5CF6"><animate attributeName="height" values="10;18;12;10" dur="1.1s" begin="-0.3s" repeatCount="indefinite"/></rect>
    <rect x="1112" y="74" width="7" height="16" fill="#22D3EE"><animate attributeName="height" values="16;24;18;16" dur="1.5s" begin="-0.5s" repeatCount="indefinite"/></rect>
    <rect x="1128" y="74" width="7" height="12" fill="#8B5CF6"><animate attributeName="height" values="12;20;14;12" dur="1.2s" begin="-0.7s" repeatCount="indefinite"/></rect>
    <rect x="1144" y="74" width="7" height="18" fill="#22D3EE"><animate attributeName="height" values="18;26;20;18" dur="1.4s" begin="-0.2s" repeatCount="indefinite"/></rect>
    <rect x="1160" y="74" width="7" height="10" fill="#8B5CF6"><animate attributeName="height" values="10;16;12;10" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/></rect>
    <rect x="1176" y="74" width="7" height="14" fill="#22D3EE"><animate attributeName="height" values="14;22;18;14" dur="1.1s" begin="-0.6s" repeatCount="indefinite"/></rect>
    <rect x="1192" y="74" width="7" height="12" fill="#8B5CF6"><animate attributeName="height" values="12;18;14;12" dur="1.3s" begin="-0.8s" repeatCount="indefinite"/></rect>
