<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="NYN-05 engineering command center: Jhashank Nayan, backend engineer working across ML systems and distributed systems">
  <defs>
    <style>
      .blink { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      .pulseV { animation: pulse 2.8s ease-in-out infinite; }
      .pulseC { animation: pulse 2.8s ease-in-out 1.4s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .glowA { animation: glow 8s ease-in-out infinite; }
      .glowB { animation: glow 8s ease-in-out 4s infinite; }
      @keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      .scan { animation: scan 14s linear infinite; }
      @keyframes scan { 0% { transform: translateY(26px); } 100% { transform: translateY(368px); } }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16202C" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="offset" values="0.55;1;0.55" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cmdClip">
      <rect x="96" y="390" width="0" height="30">
        <animate attributeName="width" from="0" to="630" dur="1.8s" begin="0.7s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1280" height="460" fill="#0A0F14"/>
