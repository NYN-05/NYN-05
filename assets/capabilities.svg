<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Capability modules: languages, infrastructure and data, ML and AI proficiency meters">
  <defs>
    <style>
      .blink { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      .pulseL { animation: pulse 2.8s ease-in-out infinite; }
      .pulseG { animation: pulse 2.8s ease-in-out 1.4s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .glowA { animation: glow 8s ease-in-out infinite; }
      .glowB { animation: glow 8s ease-in-out 4s infinite; }
      @keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      .scan { animation: scan 16s linear infinite; }
      @keyframes scan { 0% { transform: translateY(30px); } 100% { transform: translateY(440px); } }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16202C" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowLemon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C8F560" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C8F560" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGrey" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8F560"/>
      <stop offset="100%" stop-color="#7C9E1C"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8F560" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C8F560" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C8F560" stop-opacity="0"/>
    </linearGradient>
  </defs>

