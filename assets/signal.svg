<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Animated signal grid monitor: 12 months of activity intensity with active pulses">
  <defs>
    <style>
      .blink { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      .pulseL { animation: pulse 2.8s ease-in-out infinite; }
      .pulseG { animation: pulse 2.8s ease-in-out 1.4s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .glowA { animation: glow 8s ease-in-out infinite; }
      .glowB { animation: glow 8s ease-in-out 4s infinite; }
      @keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
    <pattern id="cellPat" width="24" height="19" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="13" rx="3" fill="#1B2531"/>
      <rect x="0" y="19" width="20" height="13" rx="3" fill="#1F2A38"/>
      <rect x="0" y="38" width="20" height="13" rx="3" fill="#1B2531"/>
      <rect x="0" y="57" width="20" height="13" rx="3" fill="#1F2A38"/>
      <rect x="0" y="76" width="20" height="13" rx="3" fill="#1B2531"/>
      <rect x="0" y="95" width="20" height="13" rx="3" fill="#1F2A38"/>
      <rect x="0" y="114" width="20" height="13" rx="3" fill="#1B2531"/>
    </pattern>
    <radialGradient id="glowLemon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D8FF5E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D8FF5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGrey" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" fill="#0A0F14"/>
  <ellipse cx="300" cy="170" rx="430" ry="260" fill="url(#glowLemon)" class="glowA"/>
  <ellipse cx="1020" cy="200" rx="430" ry="260" fill="url(#glowGrey)" class="glowB"/>

  <rect x="24" y="20" width="1232" height="300" rx="16" fill="#0D131A" fill-opacity="0.92" stroke="#223040" stroke-width="1.5"/>
  <rect x="26" y="22" width="1228" height="1.5" fill="#FFFFFF" opacity="0.05"/>

  <path d="M40 36h16v16" fill="none" stroke="#2E3D50" stroke-width="2"/>
  <path d="M1240 36h-16v16" fill="none" stroke="#2E3D50" stroke-width="2"/>
  <path d="M40 304h16v-16" fill="none" stroke="#2E3D50" stroke-width="2"/>
  <path d="M1240 304h-16v-16" fill="none" stroke="#2E3D50" stroke-width="2"/>

  <text x="48" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3" fill="#94A3B8">SIGNAL GRID ▸ 12 MONTHS</text>
  <circle cx="1154" cy="58" r="4" fill="#D8FF5E" class="pulseL"/>
  <circle cx="1194" cy="58" r="4" fill="#94A3B8" class="pulseG"/>
  <line x1="24" y1="80" x2="1256" y2="80" stroke="#1C2733" stroke-width="1.5"/>

  <rect x="48" y="100" width="1152" height="133" fill="url(#cellPat)"/>

  <g>
    <rect x="96" y="100" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="96" y="138" width="20" height="13" rx="3" fill="#223043"/>
    <rect x="288" y="119" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="288" y="157" width="20" height="13" rx="3" fill="#223043"/>
    <rect x="312" y="100" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="336" y="138" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="552" y="119" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="552" y="176" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="576" y="100" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="576" y="157" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="744" y="119" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="768" y="138" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="768" y="176" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="912" y="100" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="912" y="157" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="936" y="119" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="960" y="176" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="1056" y="100" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="1056" y="138" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="1080" y="157" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="1104" y="119" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="1104" y="176" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="1128" y="100" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="1128" y="138" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="1152" y="119" width="20" height="13" rx="3" fill="#33485F"/>
    <rect x="1152" y="157" width="20" height="13" rx="3" fill="#2A3B52"/>
    <rect x="1152" y="176" width="20" height="13" rx="3" fill="#33485F"/>
  </g>

  <g fill="#D8FF5E">
    <rect x="1056" y="119" width="20" height="13" rx="3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="1104" y="138" width="20" height="13" rx="3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="1080" y="176" width="20" height="13" rx="3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="1128" y="157" width="20" height="13" rx="3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="936" y="157" width="20" height="13" rx="3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></rect>
    <rect x="1152" y="100" width="20" height="13" rx="3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="912" y="138" width="20" height="13" rx="3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="2.4s" repeatCount="indefinite"/></rect>
    <rect x="576" y="119" width="20" height="13" rx="3"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="2.8s" repeatCount="indefinite"/></rect>
  </g>

  <rect x="48" y="100" width="24" height="133" fill="#D8FF5E" opacity="0.1">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1128 0" dur="3.5s" begin="1s" repeatCount="indefinite"/>
  </rect>

  <text x="48" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6E7F93">avg signal: steady · peak: recent 12w · 30+ repos tracked</text>
  <rect x="544" y="253" width="8" height="17" fill="#D8FF5E" class="blink"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6E7F93">
    <circle cx="1124" cy="260" r="4" fill="#D8FF5E" class="pulseL"/>
    <text x="1136" y="264">active</text>
    <circle cx="1190" cy="260" r="4" fill="#94A3B8" class="pulseG"/>
    <text x="1202" y="264">steady</text>
  </g>
</svg>